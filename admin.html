<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lavish Packages Admin</title>
  <style>
    :root {
      --maroon: #7A1B2A;
      --gold: #D4AF37;
      --bg: #f8f5f2;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --border: rgba(122, 27, 42, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Open Sans", Arial, sans-serif;
      line-height: 1.4;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--maroon);
      font-family: "Playfair Display", Georgia, serif;
    }

    .muted {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .btn {
      min-height: 44px;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--maroon);
      color: #fff;
    }

    .btn-outline {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--maroon);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 8px 0 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .status {
      margin-top: 6px;
      font-weight: 700;
      color: #0f6b2c;
      min-height: 20px;
    }

    .json-box {
      margin-top: 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      color: #2c2c2c;
    }

    @media (max-width: 980px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Packages Admin</h1>
    <p class="muted">Edit package prices/features, save locally, and export JSON for deployment.</p>

    <div class="toolbar">
      <button class="btn btn-primary" id="saveBtn" type="button">Save to Local Browser</button>
      <button class="btn btn-outline" id="clearBtn" type="button">Clear Local Override</button>
      <button class="btn btn-outline" id="downloadBtn" type="button">Download JSON</button>
    </div>

    <div id="cards" class="cards"></div>
    <div id="status" class="status"></div>

    <div class="json-box">
      <strong>Generated JSON Preview</strong>
      <pre id="jsonPreview"></pre>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "lavishPackagesDataV2";
      const SOURCE_JSON = "assets/data/packages.json";
      const DEFAULT_WHATSAPP = "923008292033";
      const cardsEl = document.getElementById("cards");
      const statusEl = document.getElementById("status");
      const jsonPreviewEl = document.getElementById("jsonPreview");
      const saveBtn = document.getElementById("saveBtn");
      const clearBtn = document.getElementById("clearBtn");
      const downloadBtn = document.getElementById("downloadBtn");

      function setStatus(msg, isError) {
        statusEl.textContent = msg;
        statusEl.style.color = isError ? "#8a1020" : "#0f6b2c";
      }

      function normalizePackage(pkg) {
        return {
          title: pkg && pkg.title ? String(pkg.title) : "",
          price: pkg && pkg.price ? String(pkg.price) : "",
          popular: !!(pkg && pkg.popular),
          whatsappNumber: (pkg && pkg.whatsappNumber) ? String(pkg.whatsappNumber) : DEFAULT_WHATSAPP,
          features: Array.isArray(pkg && pkg.features) ? pkg.features.map(String) : []
        };
      }

      function readFormData() {
        const cardNodes = cardsEl.querySelectorAll(".card");
        const data = [];
        cardNodes.forEach(function (cardNode) {
          const title = cardNode.querySelector("[data-field='title']").value.trim();
          const price = cardNode.querySelector("[data-field='price']").value.trim();
          const popular = cardNode.querySelector("[data-field='popular']").checked;
          const whatsappNumber = cardNode.querySelector("[data-field='whatsappNumber']").value.trim() || DEFAULT_WHATSAPP;
          const featuresRaw = cardNode.querySelector("[data-field='features']").value;
          const features = featuresRaw
            .split("\n")
            .map(function (line) { return line.trim(); })
            .filter(Boolean);
          data.push({ title: title, price: price, popular: popular, whatsappNumber: whatsappNumber, features: features });
        });
        return data;
      }

      function renderPreview() {
        const data = readFormData();
        jsonPreviewEl.textContent = JSON.stringify(data, null, 2);
      }

      function createCard(pkg, index) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          "<label>Title</label>" +
          "<input data-field='title' type='text' value='" + escapeHtml(pkg.title) + "'>" +
          "<label>Price</label>" +
          "<input data-field='price' type='text' value='" + escapeHtml(pkg.price) + "'>" +
          "<label>WhatsApp Number</label>" +
          "<input data-field='whatsappNumber' type='text' value='" + escapeHtml(pkg.whatsappNumber || DEFAULT_WHATSAPP) + "'>" +
          "<label>Features (one line = one bullet)</label>" +
          "<textarea data-field='features'>" + escapeHtml((pkg.features || []).join("\n")) + "</textarea>" +
          "<div class='check-row'><input data-field='popular' type='checkbox' id='popular_" + index + "'" + (pkg.popular ? " checked" : "") + "><label for='popular_" + index + "' style='margin:0'>Most Popular</label></div>";
        return card;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderForm(packagesData) {
        cardsEl.innerHTML = "";
        packagesData.forEach(function (pkg, idx) {
          cardsEl.appendChild(createCard(normalizePackage(pkg), idx));
        });
        cardsEl.querySelectorAll("input, textarea").forEach(function (el) {
          el.addEventListener("input", renderPreview);
          el.addEventListener("change", renderPreview);
        });
        renderPreview();
      }

      function loadData() {
        const fromLocalRaw = localStorage.getItem(STORAGE_KEY);
        if (fromLocalRaw) {
          try {
            const fromLocal = JSON.parse(fromLocalRaw);
            if (Array.isArray(fromLocal) && fromLocal.length) {
              renderForm(fromLocal);
              setStatus("Loaded local override data.", false);
              return;
            }
          } catch (err) {
            setStatus("Local data was invalid. Loaded file data instead.", true);
          }
        }

        fetch(SOURCE_JSON)
          .then(function (res) {
            if (!res.ok) throw new Error("Could not load source JSON.");
            return res.json();
          })
          .then(function (json) {
            renderForm(Array.isArray(json) ? json : []);
            setStatus("Loaded packages from assets/data/packages.json", false);
          })
          .catch(function () {
            renderForm([
              { title: "Basic Package", price: "Rs. 700/head", popular: false, whatsappNumber: DEFAULT_WHATSAPP, features: ["Starter + 1 main course + dessert"] },
              { title: "Standard Wedding", price: "Rs. 1800-2500/head", popular: true, whatsappNumber: DEFAULT_WHATSAPP, features: ["Multiple starters and premium mains"] },
              { title: "Premium Events", price: "Custom Pricing", popular: false, whatsappNumber: DEFAULT_WHATSAPP, features: ["Fully bespoke event menu"] }
            ]);
            setStatus("Loaded fallback defaults.", true);
          });
      }

      saveBtn.addEventListener("click", function () {
        try {
          const data = readFormData();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          renderPreview();
          setStatus("Saved. Website will use this local data on this browser.", false);
        } catch (err) {
          setStatus("Could not save data.", true);
        }
      });

      clearBtn.addEventListener("click", function () {
        localStorage.removeItem(STORAGE_KEY);
        setStatus("Local override removed. Reload to use JSON file values.", false);
      });

      downloadBtn.addEventListener("click", function () {
        const data = readFormData();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "packages.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      });

      loadData();
    })();
  </script>
</body>

</html>
